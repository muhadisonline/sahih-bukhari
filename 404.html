<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قريبًا — سُنَن</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4efe4;color:#1c1712;font-family:"IBM Plex Sans Arabic",sans-serif}
main{text-align:center;padding:2rem 1.25rem}
img{width:6.5rem;height:auto}
h1{font-family:Amiri,serif;font-size:2.4rem;margin:.6rem 0 0}
p{font-size:1.15rem;color:#3d4a43}
a{color:#1c4536}
</style>
</head>
<body>
<script>
(function () {
  var m = location.pathname.match(/^\/(abudawud|adab|buxari|darimi|ibnmajah|malik|muslim|nasai|riyad|tirmidhi|sahaba)\/(\d+)\/?$/);
  if (!m) return;
  var n = Number(m[2]);
  var b = Math.floor(n / 500) * 500;
  location.replace("/" + m[1] + "/" + b + "/" + n + "/");
})();
</script>

<main>
<img src="/assets/emblem.png" alt="">
<h1>قريبًا</h1>
<p>هذا القسم لم يُفتح بعد.</p>
<p><a href="/">العودة إلى الرئيسية</a></p>
</main>
</body>
</html>
